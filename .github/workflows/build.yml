name: build

# Every push (any branch) and every pull request builds and tests with the
# .NET 10 SDK and packs the packages exactly as a release does; they are kept
# as a workflow artifact for 7 days. Nothing is published then: no tag, no
# GitHub release, no semantic-release.
#
# A release is only made by hand: Actions -> build -> Run workflow on main
# with "release" ticked, or `gh workflow run build.yml --ref main -f
# release=true`. The build job runs first; only when it passed does
# semantic-release read the Conventional Commits since the last tag: for a
# feat, fix or breaking change it writes VERSION and CHANGELOG.md, commits
# that as "chore(release): vX.Y.Z [skip ci]", tags vX.Y.Z and creates the
# GitHub release as a draft. publish then builds that tag, adds the packages
# to the draft and only then publishes it, so a release never shows up
# without its files (a failed publish leaves the draft: re-run the failed
# job). docs, chore, ci etc. make no release.
on:
  push:
    # every branch except Dependabot's: its pull request builds them anyway
    branches: ['**', '!dependabot/**']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Make a release (semantic-release, tag, GitHub release with the packages)
        type: boolean
        default: false

# A newer push or pull request update cancels the older check run; manual
# runs (and so releases) are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags, for the version
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: make test
        run: make test
      - name: make package
        run: make package
      - uses: actions/upload-artifact@v7
        with:
          name: gamewe-counterstrikesharp
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.tar.gz.sha256
            dist/*.zip.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.release
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: releases only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::a release can only be made from main, not from $GITHUB_REF"
          exit 1
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # all tags and commits since the last release
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: semantic-release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: >-
          npx --yes
          -p semantic-release@25.0.9
          -p @semantic-release/changelog@7.0.0
          -p @semantic-release/exec@7.1.0
          -p @semantic-release/git@11.0.1
          -p conventional-changelog-conventionalcommits@9.3.1
          semantic-release

  publish:
    needs: release
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    env:
      RELEASE: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.release.outputs.version }}
          fetch-depth: 0 # tags, for the version
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: make package
        run: make package
      - name: add the packages to the draft release and publish it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "v$RELEASE" dist/*.tar.gz dist/*.zip dist/*.tar.gz.sha256 dist/*.zip.sha256 --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "v$RELEASE" --draft=false --latest --repo "$GITHUB_REPOSITORY"
