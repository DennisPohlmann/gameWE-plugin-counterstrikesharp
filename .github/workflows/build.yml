name: build

# Every push to main builds and tests with the .NET 10 SDK and keeps the
# packages as a workflow artifact. semantic-release then reads the
# Conventional Commits since the last tag: for a feat, fix or breaking change
# it writes VERSION and CHANGELOG.md, commits that as
# "chore(release): vX.Y.Z [skip ci]", tags vX.Y.Z and creates the GitHub
# release; publish then builds that tag and adds the packages to the
# release. A manual run or a pull request (e.g. from Dependabot) builds
# without publishing.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags, for the version
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: make test
        run: make test
      - name: make package
        run: make package
      - uses: actions/upload-artifact@v7
        with:
          name: gamewe-counterstrikesharp
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.tar.gz.sha256
            dist/*.zip.sha256
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # all tags and commits since the last release
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: semantic-release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: >-
          npx --yes
          -p semantic-release@25.0.9
          -p @semantic-release/changelog@7.0.0
          -p @semantic-release/exec@7.1.0
          -p @semantic-release/git@11.0.1
          -p conventional-changelog-conventionalcommits@9.3.1
          semantic-release

  publish:
    needs: release
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    env:
      RELEASE: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.release.outputs.version }}
          fetch-depth: 0 # tags, for the version
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: make package
        run: make package
      - name: add the packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v$RELEASE" dist/*.tar.gz dist/*.zip dist/*.tar.gz.sha256 dist/*.zip.sha256 --repo "$GITHUB_REPOSITORY"
